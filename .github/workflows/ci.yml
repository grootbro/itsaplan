name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run still in flight for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.0

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Cache the global bun install cache, keyed by the lockfile.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Mobile unit tests
        working-directory: apps/mobile
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Script tests
        run: bun test scripts/

      # High and critical advisories fail the job; moderate and lower only print.
      - name: Audit dependencies
        run: bun audit --audit-level=high

  mobile-ui:
    name: Synthetic mobile UI scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MOBILE_UI_TOOLS: /tmp/itsaplan-mobile-ui-tools
      MOBILE_UI_REPORT: /tmp/mobile-ui-report
      MOBILE_UI_RESULTS: /tmp/mobile-ui-results
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --ignore-scripts --filter mobile
      - name: Install isolated browser test tools
        run: |
          mkdir -p "$MOBILE_UI_TOOLS"
          cp apps/mobile/qa/tools/package.json apps/mobile/qa/tools/bun.lock "$MOBILE_UI_TOOLS/"
          bun install --cwd "$MOBILE_UI_TOOLS" --frozen-lockfile --ignore-scripts
          ln -s "$MOBILE_UI_TOOLS/node_modules" apps/mobile/qa/node_modules
          "$MOBILE_UI_TOOLS/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run synthetic mobile UI scenarios
        run: '"$MOBILE_UI_TOOLS/node_modules/.bin/playwright" test --config apps/mobile/qa/playwright.config.ts'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: synthetic-mobile-ui-evidence
          path: |
            /tmp/mobile-ui-report
            /tmp/mobile-ui-results

  mobile-bundle:
    name: Export native mobile bundles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --ignore-scripts --filter mobile
      - name: Export iOS JavaScript and assets
        working-directory: apps/mobile
        run: bun run expo export --platform ios --output-dir "$RUNNER_TEMP/mobile-ios-export"
      - name: Export Android JavaScript and assets
        working-directory: apps/mobile
        run: bun run expo export --platform android --output-dir "$RUNNER_TEMP/mobile-android-export"

  build:
    name: Build apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Cache the global bun install cache, keyed by the lockfile.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Integration tests need a live database, so they run in the compose gate:
      # a throwaway Postgres and object store, with the api built from the production
      # Dockerfile. Building both api-test and worker-test also verifies their
      # Dockerfiles build.
      - name: Build test images
        run: docker compose -f docker-compose.test.yml build

      # `run` starts api-test's dependencies (Postgres healthy, the object-store bucket
      # init completed), runs the suite, and exits with its code. It does not use
      # --abort-on-container-exit, which would tear the stack down the moment the
      # one-shot minio-test-init exits, before api-test starts.
      - name: Run the compose test gate
        run: docker compose -f docker-compose.test.yml run --rm api-test

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
